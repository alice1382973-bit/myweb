<body>

<header>
    <h2>☁ 只想睡覺幸福企業社</h2>

        <a href="about.html">公司介紹</a>
        <a href="contact.html">聯絡我們</a>
    </nav>
</header>

<section class="page-banner">
    <h1>聯絡我們</h1>
    <p>CONTACT US</p>
</section>

<section class="contact-section">

    <h2>歡迎與我們聯絡 ♡</h2>
    <p>如果您有任何商品問題或合作需求，歡迎填寫以下表單。</p>

    <form action="https://formsubmit.co/alice1382973@gmail.com"
          method="POST">

        <!-- 郵件主旨 -->
        <input type="hidden" name="_subject"
               value="只想睡覺幸福企業社－網站聯絡表單">

        <!-- 郵件格式 -->
        <input type="hidden" name="_template" value="table">

        <!-- 防止垃圾郵件 -->
        <input type="text" name="_honey"
               style="display:none">

        <label>姓名 *</label>
        <input type="text" name="姓名"
               placeholder="請輸入姓名" required>

        <label>電話 *</label>
        <input type="tel" name="電話"
               placeholder="請輸入聯絡電話" required>

        <label>Email *</label>
        <input type="email" name="Email"
               placeholder="請輸入電子郵件" required>

        <label>聯絡內容 *</label>
        <textarea name="聯絡內容"
                  rows="6"
                  placeholder="請輸入您想詢問的內容"
                  required></textarea>

        <button type="submit" class="btn">
            送出聯絡表單
        </button>

    </form>

    <p class="email-info">
        聯絡信箱：alice1382973@gmail.com
    </p>

</section>

<footer>
    <p>© 2026 只想睡覺幸福企業社</p>
    <p>讓好眠成為生活中的小幸福 ♡</p>
</footer>
