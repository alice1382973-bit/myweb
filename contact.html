<form action="https://formspree.io/f/maeebrwz" method="POST">

    <div class="form-group">
        <label for="customerName">姓名 *</label>
        <input
            id="customerName"
            name="姓名"
            type="text"
            required
            placeholder="請輸入您的姓名">
    </div>

    <div class="form-group">
        <label for="phone">聯絡電話 *</label>
        <input
            id="phone"
            name="聯絡電話"
            type="tel"
            required
            placeholder="例如：0912-345-678">
    </div>

    <div class="form-group">
        <label for="email">電子郵件 *</label>
        <input
            id="email"
            name="Email"
            type="email"
            required
            placeholder="例如：yourname@email.com">
    </div>

    <div class="form-group">
        <label for="topic">諮詢類別</label>
        <select id="topic" name="諮詢類別">
            <option value="商品資訊">商品資訊</option>
            <option value="尺寸與規格">尺寸與規格</option>
            <option value="訂購與配送">訂購與配送</option>
            <option value="售後服務">售後服務</option>
            <option value="其他問題">其他問題</option>
        </select>
    </div>

    <div class="form-group">
        <label for="message">想詢問的內容 *</label>
        <textarea
            id="message"
            name="訊息內容"
            required
            placeholder="請描述想詢問的商品、尺寸或其他需求……"></textarea>
    </div>

    <input type="hidden" name="_subject"
        value="只想睡覺企業社｜網站收到新的商品諮詢">

    <input type="hidden" name="_replyto" id="replyto">

    <button class="submit-btn" type="submit">
        送出諮詢 ✉️
    </button>

</form>
